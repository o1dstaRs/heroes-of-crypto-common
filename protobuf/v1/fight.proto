syntax = "proto3";

package PBTypes;

import "types.proto";

message Fight {
    bytes id = 1;
    uint32 current_lap = 2;
    GridVals grid_type = 3;
    bool first_turn_made = 4;
    bool fight_started = 5;
    bool fight_finished = 6;
    TeamVals previous_turn_team = 7;
    int32 highest_speed_this_turn = 8;
    repeated string already_made_turn = 9;
    map<uint32, StringList> already_made_turn_by_team = 10;
    repeated string already_hourglass = 11;
    repeated string already_replied_attack = 12;
    map<uint32, uint32> team_units_alive = 13;
    repeated string hourglass_queue = 14;
    repeated string morale_plus_queue = 15;
    repeated string morale_minus_queue = 16;
    int64 current_turn_start = 17;
    int64 current_turn_end = 18;
    map<uint32, uint32> current_lap_total_time_per_team = 19;
    repeated string up_next = 20;
    double steps_morale_multiplier = 21;
    map<uint32, bool> has_additional_time_requested_per_team = 22;
    repeated SmokeCell smoke_clouds = 23;
    // Cells currently covered by a thrown vine (Vine Throw). Same {x, y, laps_remaining} shape as a smoke
    // cell, so it reuses SmokeCell rather than declaring a near-identical message.
    repeated SmokeCell vine_cells = 24;
    // Cells currently alight from a Fire Wall cast. Same {x, y, laps_remaining} shape again, so it reuses
    // SmokeCell for the same reason vine_cells does.
    repeated SmokeCell fire_wall_cells = 25;
}

// One cell currently covered by a transient Smoke cloud (Smoke spell). Carried on the Fight so it survives
// snapshot/restore; the engine decrements laps on lap-transition and dispels on creature-occupy.
message SmokeCell {
    int32 x = 1;
    int32 y = 2;
    int32 laps_remaining = 3;
}
